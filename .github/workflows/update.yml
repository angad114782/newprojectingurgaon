name: Deploy to KVM VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment..."

            cd /var/www/gurgaon-realestate

            echo "📥 Pulling latest code..."
            git fetch origin

            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            echo "Current branch: $CURRENT_BRANCH"

            git reset --hard origin/$CURRENT_BRANCH

            echo "📦 Backend install..."
            cd /var/www/gurgaon-realestate/backend
            npm install --omit=dev

            echo "🔁 Restart backend..."
            pm2 restart newproject-backend

            echo "📦 Frontend install..."
            cd /var/www/gurgaon-realestate/frontend
            npm install

            echo "🏗️ Frontend build..."
            npm run build

            echo "🔁 Restart frontend..."
            pm2 restart newproject-frontend

            echo "💾 Save PM2..."
            pm2 save

            echo "🔄 Reload Nginx..."
            nginx -t
            systemctl reload nginx

            echo "✅ Deployment completed!"