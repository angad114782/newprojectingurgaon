name: Deploy to KVM VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd /var/www/gurgaon-realestate

            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master

            echo "📦 Installing backend dependencies..."
            cd /var/www/gurgaon-realestate/backend
            npm install --omit=dev

            echo "🔁 Restarting backend..."
            pm2 restart newproject-backend || pm2 start npm --name newproject-backend -- start

            echo "📦 Installing frontend dependencies..."
            cd /var/www/gurgaon-realestate/frontend
            npm install

            echo "🏗️ Building frontend..."
            npm run build

            echo "🔁 Restarting frontend..."
            pm2 restart newproject-frontend || pm2 start npm --name newproject-frontend -- start

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "🔄 Reloading Nginx..."
            nginx -t
            systemctl reload nginx

            echo "✅ Deployment completed successfully!"